name: QA Automation Pipeline

on:
  push:
    branches: [ "main", "feature/deploy-configs" ]
  pull_request:
    branches: [ "main", "feature/deploy-configs" ]

jobs:
  # ============================================================
  # JOB: Sobe a API no Docker do GitHub e roda o Karate
  # Ambiente 100% isolado — sem tocar no banco de produção!
  # ============================================================
  karate-api-test:
    name: 🥋 Karate API Tests (Docker CI)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v3

      - name: ☕ Setup do Java (JDK 17)
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 🐳 Subir Banco + API no Docker
        run: |
          cp .env.example .env
          # Retry até 3 vezes para lidar com rate limiting transitório do Maven Central
          for attempt in 1 2 3; do
            echo "Tentativa $attempt de build Docker..."
            docker compose up -d --build db api && break
            echo "Falhou, aguardando 30s antes de tentar novamente..."
            sleep 30
          done

      - name: ⏳ Aguardar API estar 100% pronta
        run: |
          echo "Aguardando o endpoint /health da API responder com 200..."
          # Espera até 120s pelo /health (garante que o AdminInitializer rodou)
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health || echo "000")
            echo "Tentativa $i: status=$STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ API pronta!"
              break
            fi
            sleep 2
          done
          # Falha explicitamente se a API não respondeu
          curl -f http://localhost:8080/health || (echo "❌ API não respondeu a tempo!" && exit 1)

      - name: 🥋 Rodar Testes Karate (ambiente local Docker)
        run: |
          cd backend
          mvn test -Dtest=KarateTest -Dkarate.env=dev
