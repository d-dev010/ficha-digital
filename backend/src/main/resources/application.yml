spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ficha_digital}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 10000        # falha em 10s em vez de travar 14 min
      initialization-fail-timeout: 15000
      # Neon (PgBouncer pooler) requer sslmode=require e prepareThreshold=0
      # Docker/local usa sslmode=disable (PostgreSQL sem SSL)
      # Render/Neon: definir SPRING_DATASOURCE_SSLMODE=require nas env vars
      data-source-properties:
        sslmode: ${SPRING_DATASOURCE_SSLMODE:disable}
        prepareThreshold: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    repair-on-migrate: ${SPRING_FLYWAY_REPAIR_ON_MIGRATE:false}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:28800000}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.fichadigital: INFO
    org.springframework.security: WARN


# Swagger/OpenAPI: disponível apenas no profile 'dev' (localhost).
# Em produção (Render), springdoc.api-docs.enabled=false é setado via env var.
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
