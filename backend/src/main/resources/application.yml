spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ficha_digital}?options=-c%20app.admin_email%3D${ADMIN_EMAIL:admin@fichadigital.com}%20-c%20app.admin_password_hash%3D${ADMIN_PASSWORD_HASH:$2a$10$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    repair-on-migrate: ${SPRING_FLYWAY_REPAIR_ON_MIGRATE:false}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:28800000}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.fichadigital: INFO
    org.springframework.security: WARN

# Swagger/OpenAPI: disponível apenas no profile 'dev' (localhost).
# Em produção (Render), springdoc.api-docs.enabled=false é setado via env var.
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}

